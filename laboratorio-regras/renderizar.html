<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Gerar imagens das regras · Laboratório</title><style>body{font:18px Arial;margin:30px;background:#e8f0e2;color:#173f30}button{font:inherit;padding:18px;background:#165b3d;color:white;border:0;border-radius:12px}img{width:min(640px,100%);background:#e0edcf}pre{white-space:pre-wrap}</style><h1>Imagens dos níveis · laboratório</h1><p>Renderiza os modelos aprovados em 640, 1280 e 1920 pixels. Disponível somente na prévia local.</p><button id="generate">Gerar imagens nítidas</button><pre id="status" role="status"></pre><div id="images"></div>
<script src="/assets/vendor/three-r128.min.js"></script><script src="/assets/vendor/three-r128/GLTFLoader.js"></script><script src="/assets/vendor/three-r128/SkeletonUtils.js"></script><script src="/stadium-motion.js"></script><script src="/laboratorio-arte/stadium-art-state.js"></script><script src="/stadium-visual-state.js"></script><script src="/stadium-neighborhood.js"></script><script src="imagens.js"></script>
<script>document.querySelector('#generate').onclick=async()=>{const button=document.querySelector('#generate'),status=document.querySelector('#status');button.disabled=true;try{const data=await(await fetch('/tabuleiro-oficial/bootstrap.json')).json();const starts=[0,25,200,1000,5000];for(const id of ['palmeiras','flamengo','internacional'])for(let level=0;level<5;level++){status.textContent='Renderizando '+id+' · nível '+(level+1);const team={...data.teams.find(t=>t.id===id),level,cadeiras:starts[level],n:0,fans:[],presidente:null,lideres:[],stadium_items:[]},photos=await ARENA_RULES_PHOTO.render(team);for(const w of [640,1280,1920]){const blob=await(await fetch(photos[w])).blob();const response=await fetch('/__rules_image/'+id+'-'+(level+1)+'-'+w+'.webp',{method:'POST',body:blob});if(!response.ok)throw Error('Falha ao salvar imagem');}const image=new Image();image.src=photos[1280];image.alt=id+' · nível '+(level+1);document.querySelector('#images').append(image);}status.textContent='Concluído: 45 imagens WebP (15 enquadramentos × 3 resoluções).';}catch(e){status.textContent='Erro: '+e.message;}finally{button.disabled=false;}};</script></html>
